<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plonk It</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../css/main.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">


        <!-- Logo -->

        <a href="#" class="logo">

            <img
                src="../assets/logo.png"
                alt="Plonk It Logo"
            >

        </a>


        <!-- Navbar Menu -->

        <ul class="nav-menu">

            <li>
                <a href="#">
                    หน้าแรก
                </a>
            </li>

            <li>
                <a href="#">
                    คำอธิบาย
                </a>
            </li>

            <li>
                <a href="#">
                    Video
                </a>
            </li>

            <li>
                <a href="#">
                    Github
                </a>
            </li>

           


            <!-- Theme -->

            <li>

                <button
                    id="themeToggle"
                    class="theme-toggle"
                    type="button"
                >
                    🌙
                </button>

            </li>

        </ul>

    </nav>



    


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const themeToggle =
            document.getElementById("themeToggle");


        /*
         * Load saved theme
         */

        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeToggle.textContent = "☀️";

        }


        /*
         * Toggle theme
         */

        themeToggle.addEventListener(
            "click",
            () => {

                document.body.classList.toggle("dark");


                const isDark =
                    document.body.classList.contains("dark");


                themeToggle.textContent =
                    isDark ? "☀️" : "🌙";


                localStorage.setItem(
                    "theme",
                    isDark ? "dark" : "light"
                );

            }
        );

    </script>


</body>

</html>
